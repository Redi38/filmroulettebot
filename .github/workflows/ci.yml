name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Static checks (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements/base.txt
            requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Run ruff
        run: ruff check app main.py tests

      - name: Run mypy
        run: mypy

  test:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements/base.txt
            requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Byte-compile the whole project (catches syntax errors early)
        run: python -m compileall -q app main.py

      - name: Run test suite
        run: pytest -v --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report-py${{ matrix.python-version }}
          path: pytest-report.xml
          retention-days: 14

  js-syntax:
    name: JS syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check every static JS file parses
        run: |
          set -e
          find app/web/static/js -name "*.js" -not -path "*/dist/*" -print0 \
            | xargs -0 -n1 node --check

      - name: Bundle JS (esbuild) and check it parses
        run: |
          npm install
          npm run build:js
          node --check app/web/static/js/dist/bundle.min.js

  js-types:
    name: JS type check (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Type-check JSDoc-typed files against the committed API types
        run: npm run check:js

  api-types-freshness:
    name: API types match the backend schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements/base.txt

      - name: Install backend dependencies
        run: pip install -r requirements/base.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install JS dependencies
        run: npm install

      - name: Regenerate app/web/static/js/types/api.d.ts from the live OpenAPI schema
        run: npm run generate:types

      - name: Fail if the committed types are stale (forgot to run generate:types)
        run: |
          git diff --exit-code -- app/web/static/js/types/api.d.ts || {
            echo "::error::app/web/static/js/types/api.d.ts is out of date. Run 'npm run generate:types' and commit the result.";
            exit 1;
          }
