<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#090c16">
<title>Киношная рулетка</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/buttons-cards.css">
<link rel="stylesheet" href="/static/css/home.css">
<link rel="stylesheet" href="/static/css/showcase.css">
<link rel="stylesheet" href="/static/css/spin-wheel.css">
<link rel="stylesheet" href="/static/css/feedback-history.css">
<link rel="stylesheet" href="/static/css/modal-responsive.css">
</head>
<body>

<header>
  <button id="burger-btn" aria-label="Меню"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="17" x2="20" y2="17"></line></svg></button>
  <h1 id="page-title">🎬 Афиша</h1>
  <script>
    (function () {
      try {
        var raw = localStorage.getItem("filmroulette_state");
        var s = raw ? JSON.parse(raw) : null;
        var view = (s && s.view) || "home";
        var cat = s && s.cat;
        var ALL_CATS = {
          movies: "🎬 Фильмы", cartoons: "🎥 Мульты", series: "📺 Сериалы",
          marvel: "🕷 Marvel", dc: "🦇 DC",
        };
        var titles = {
          home: "🎬 Афиша", random: "🔄 Наугад",
          spin: ALL_CATS[cat] || "", list: ALL_CATS[cat] || "",
          upcoming: "🕐 Ожидаемые", history: "📜 История",
          showcase: (ALL_CATS[cat] || "") + " — скоро",
          theaters: "🎟 В прокате", series_releases: "📺 Премьеры сериалов",
          tracked_series: "🔔 Отслеживание сериалов",
        };
        if (view in titles) document.getElementById("page-title").textContent = titles[view];
      } catch (e) {}
    })();
  </script>
  <span class="header-spacer"></span>
</header>

<div id="overlay"></div>
<div id="sidebar-brand">🎬 Киношная рулетка</div>
<nav id="side-menu"><div id="side-menu-scroll"></div></nav>

<main>
  <div id="home-section" class="section">
    <div class="home-content-wrap">
      <div class="home-hero">
        <div class="home-hero-text">
          <h2>🎬 Киношная рулетка</h2>
          <p>Твоя личная афиша: коллекция уже добавленных тайтлов и рулетка, которая подскажет, что посмотреть сегодня.</p>
        </div>
        <button class="btn btn-success home-cta" id="home-roulette-btn"><span>🎲 Крутить рулетку</span></button>
      </div>
    </div>
    <div id="home-collection-block" class="home-collection-block" style="display:none">
      <div class="home-collection-label">Твоя коллекция</div>
      <div class="marquee" id="home-marquee">
        <div class="marquee-track" id="home-marquee-track-1"></div>
      </div>
      <div class="marquee marquee-reverse" id="home-marquee-2">
        <div class="marquee-track" id="home-marquee-track-2"></div>
      </div>
    </div>
  </div>

  <div id="random-spin-section" class="section">
    <div class="spin-controls-dock">
      <div id="random-mode-toggle"></div>
      <div id="random-spin-speed"></div>
      <button class="btn btn-success" id="random-spin-btn"><span>🎲 Крутить</span></button>
    </div>
    <div id="random-wheel-wrap" class="wheel-wrap"></div>
    <div id="random-spin-result" class="spin-result"></div>
  </div>

  <div id="spin-section" class="section">
    <div class="spin-controls-dock">
      <div id="spin-mode-toggle"></div>
      <div id="spin-spin-speed"></div>
      <button class="btn btn-primary" id="spin-btn"><span>🎲 Крутить</span></button>
    </div>
    <div id="spin-wheel-wrap" class="wheel-wrap"></div>
    <div id="spin-result" class="spin-result"></div>
  </div>

  <div id="list-section" class="section">
    <div id="list-featured"></div>
    <div class="search-row">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="search-input" placeholder="Поиск по названию…">
    </div>
    <div class="add-row" id="add-row">
      <input type="text" id="add-input" placeholder="Название для добавления…">
      <button class="btn btn-primary" id="add-btn" aria-label="Добавить"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
    </div>
    <div id="list-count" class="list-count"></div>
    <div class="card" id="list-container"></div>
  </div>

  <div id="upcoming-section" class="section">
    <div class="add-row">
      <input type="text" id="up-add-input" placeholder="Название для добавления…">
      <button class="btn btn-primary" id="up-add-btn" aria-label="Добавить"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
    </div>
    <div class="actions">
      <button class="btn btn-success" id="up-check-btn">🔍 Проверить вышедшие</button>
    </div>
    <div id="up-check-result"></div>
    <div class="card" id="up-list-container"></div>
  </div>

  <div id="history-section" class="section">
    <div id="history-container"></div>
  </div>

  <div id="showcase-section" class="section">
    <div id="showcase-container"></div>
  </div>

  <div id="theaters-section" class="section">
    <div id="theaters-container"></div>
  </div>

  <div id="series-releases-section" class="section">
    <div id="series-releases-container"></div>
  </div>

  <div id="tracked-series-section" class="section">
    <div class="add-row">
      <input type="text" id="tracked-series-add-input" placeholder="Название сериала…">
      <button class="btn btn-primary" id="tracked-series-add-btn" aria-label="Добавить"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>
    </div>
    <div id="tracked-series-container"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<div id="modal-overlay">
  <div id="modal-box">
    <h3 id="modal-title">Куда перенести?</h3>
    <div class="modal-options" id="modal-options"></div>
    <button class="modal-cancel" id="modal-cancel">Отмена</button>
  </div>
</div>

<div id="rename-modal-overlay">
  <div id="rename-modal-box">
    <h3>Изменить название</h3>
    <input type="text" id="rename-modal-input" class="rename-modal-input" maxlength="200">
    <div class="rename-modal-actions">
      <button class="btn btn-primary" id="rename-modal-save">Сохранить</button>
      <button class="modal-cancel" id="rename-modal-cancel">Отмена</button>
    </div>
  </div>
</div>

<div id="poster-info-overlay">
  <div id="poster-info-box">
    <button class="modal-close" id="poster-info-close" aria-label="Закрыть">✕</button>
    <div id="poster-info-content"></div>
  </div>
</div>

<script src="/static/js/core/utils.js"></script>
<script src="/static/js/core/state.js"></script>
<script src="/static/js/core/modal.js"></script>
<script src="/static/js/core/menu.js"></script>
<script src="/static/js/core/router.js"></script>
<script src="/static/js/spin/spin-settings.js"></script>
<script src="/static/js/spin/wheel/layout.js"></script>
<script src="/static/js/spin/wheel/render.js"></script>
<script src="/static/js/spin/wheel/spin.js"></script>
<script src="/static/js/spin/wheel/viewport.js"></script>
<script src="/static/js/spin/wheel/hub-upload.js"></script>
<script src="/static/js/card/card-render.js"></script>
<script src="/static/js/spin/spin-actions.js"></script>
<script src="/static/js/card/pick-actions.js"></script>
<script src="/static/js/list/list-row.js"></script>
<script src="/static/js/list/list-items.js"></script>
<script src="/static/js/list/upcoming-list.js"></script>
<script src="/static/js/history/history.js"></script>
<script src="/static/js/showcase/showcase-filters.js"></script>
<script src="/static/js/showcase/showcase-row.js"></script>
<script src="/static/js/showcase/showcase.js"></script>
<script src="/static/js/theaters/theaters.js"></script>
<script src="/static/js/home/home.js"></script>
<script src="/static/js/core/main.js"></script>
</body>
</html>
