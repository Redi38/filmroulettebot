services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    environment:
      DB_PATH: /app/data/bot_data.db
    labels:
      - "autoheal=true"

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["uvicorn", "app.web.server:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8010:8000"
    volumes:
      - ./data:/app/data
    environment:
      DB_PATH: /app/data/bot_data.db

  autoheal:
    image: willfarrell/autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
